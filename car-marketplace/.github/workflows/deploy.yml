# ════════════════════════════════════════════════════════════════
#  APEX Motors — Dynamic CI/CD Pipeline
#  Detects stack automatically: React/Vite · Angular · Node.js
#  Registry: GitHub Container Registry (GHCR)
#  Target: Civo Cloud K3s Cluster
# ════════════════════════════════════════════════════════════════
name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}        # e.g. username/car-marketplace
  K8S_NAMESPACE: car-marketplace

# ────────────────────────────────────────────
# JOB 1: Detect stack (the Lego block router)
# ────────────────────────────────────────────
jobs:
  detect-stack:
    name: 🔍 Detect project stack
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
      build_cmd: ${{ steps.detect.outputs.build_cmd }}
      test_cmd: ${{ steps.detect.outputs.test_cmd }}
      port: ${{ steps.detect.outputs.port }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect stack from project files
        id: detect
        run: |
          if [ -f "angular.json" ]; then
            echo "stack=angular"        >> $GITHUB_OUTPUT
            echo "build_cmd=npm run build -- --configuration production" >> $GITHUB_OUTPUT
            echo "test_cmd=npm run test -- --watch=false --browsers=ChromeHeadless" >> $GITHUB_OUTPUT
            echo "port=4200"            >> $GITHUB_OUTPUT

          elif [ -f "package.json" ] && grep -q '"vite"' package.json; then
            echo "stack=react-vite"     >> $GITHUB_OUTPUT
            echo "build_cmd=npm run build" >> $GITHUB_OUTPUT
            echo "test_cmd=npm run test -- --run 2>/dev/null || echo 'no tests'" >> $GITHUB_OUTPUT
            echo "port=8080"            >> $GITHUB_OUTPUT

          elif [ -f "package.json" ] && grep -q '"next"' package.json; then
            echo "stack=nextjs"         >> $GITHUB_OUTPUT
            echo "build_cmd=npm run build" >> $GITHUB_OUTPUT
            echo "test_cmd=npm test 2>/dev/null || echo 'no tests'" >> $GITHUB_OUTPUT
            echo "port=3000"            >> $GITHUB_OUTPUT

          elif [ -f "package.json" ] && grep -q '"express"\|"fastify"\|"koa"' package.json; then
            echo "stack=nodejs-backend" >> $GITHUB_OUTPUT
            echo "build_cmd=echo 'no build step for Node'" >> $GITHUB_OUTPUT
            echo "test_cmd=npm test 2>/dev/null || echo 'no tests'" >> $GITHUB_OUTPUT
            echo "port=3000"            >> $GITHUB_OUTPUT

          elif [ -f "pom.xml" ]; then
            echo "stack=java-maven"     >> $GITHUB_OUTPUT
            echo "build_cmd=mvn package -DskipTests" >> $GITHUB_OUTPUT
            echo "test_cmd=mvn test"    >> $GITHUB_OUTPUT
            echo "port=8080"            >> $GITHUB_OUTPUT

          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "stack=java-gradle"    >> $GITHUB_OUTPUT
            echo "build_cmd=./gradlew build -x test" >> $GITHUB_OUTPUT
            echo "test_cmd=./gradlew test" >> $GITHUB_OUTPUT
            echo "port=8080"            >> $GITHUB_OUTPUT

          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "stack=python"         >> $GITHUB_OUTPUT
            echo "build_cmd=echo 'no build for Python'" >> $GITHUB_OUTPUT
            echo "test_cmd=pytest 2>/dev/null || echo 'no tests'" >> $GITHUB_OUTPUT
            echo "port=8000"            >> $GITHUB_OUTPUT

          else
            echo "stack=unknown"        >> $GITHUB_OUTPUT
            echo "build_cmd=echo 'Unknown stack - add detection logic'" >> $GITHUB_OUTPUT
            echo "test_cmd=echo 'no tests'" >> $GITHUB_OUTPUT
            echo "port=8080"            >> $GITHUB_OUTPUT
          fi

          echo "✅ Detected stack: $(cat $GITHUB_OUTPUT | grep '^stack=' | cut -d= -f2)"

# ────────────────────────────────────────────
# JOB 2: Test (uses detected stack commands)
# ────────────────────────────────────────────
  test:
    name: 🧪 Test [${{ needs.detect-stack.outputs.stack }}]
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (if JS/TS stack)
        if: contains(fromJson('["react-vite","angular","nextjs","nodejs-backend"]'), needs.detect-stack.outputs.stack)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (if Java stack)
        if: contains(fromJson('["java-maven","java-gradle"]'), needs.detect-stack.outputs.stack)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Python (if Python stack)
        if: needs.detect-stack.outputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          STACK="${{ needs.detect-stack.outputs.stack }}"
          if [[ "$STACK" == react-vite || "$STACK" == angular || "$STACK" == nextjs || "$STACK" == nodejs-backend ]]; then
            npm ci --frozen-lockfile
          elif [[ "$STACK" == python ]]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: ${{ needs.detect-stack.outputs.test_cmd }}

# ────────────────────────────────────────────
# JOB 3: Build Docker image & push to GHCR
# ────────────────────────────────────────────
  build-push:
    name: 🐳 Build & Push [${{ needs.detect-stack.outputs.stack }}]
    runs-on: ubuntu-latest
    needs: [detect-stack, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write        # needed to push to GHCR
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STACK=${{ needs.detect-stack.outputs.stack }}
          cache-from: type=gha          # GitHub Actions cache
          cache-to: type=gha,mode=max

# ────────────────────────────────────────────
# JOB 4: Deploy to Civo K3s
# ────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Civo K3s
    runs-on: ubuntu-latest
    needs: [detect-stack, build-push]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://cars.YOUR_DOMAIN.com    # ← replace with your domain
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubectl for Civo
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CIVO_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Create/update GHCR image pull secret
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests
        run: |
          # Replace placeholder values in manifests
          GITHUB_USER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          # Substitute image tag in deployment manifest
          sed -i "s|GITHUB_USERNAME|${GITHUB_USER}|g" k8s/deployment.yaml
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" k8s/deployment.yaml

          # Apply all manifests in order
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/cert-manager-issuer.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/car-marketplace \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --timeout=120s

      - name: Verify deployment
        run: |
          echo "─────────────────────────────────"
          echo "  Stack: ${{ needs.detect-stack.outputs.stack }}"
          echo "  Image: ${{ needs.build-push.outputs.image_tag }}"
          echo "─────────────────────────────────"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
