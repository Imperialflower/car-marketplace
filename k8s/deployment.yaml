apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-marketplace
  namespace: car-marketplace
  labels:
    app: car-marketplace
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-marketplace
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero downtime
  template:
    metadata:
      labels:
        app: car-marketplace
    spec:
      containers:
        - name: car-marketplace
          image: ghcr.io/GITHUB_USERNAME/car-marketplace:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-secret
